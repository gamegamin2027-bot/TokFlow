# Blueprint Render — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: tokflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    # "free" (512 Mo) suffit pour le MP4 sans ré-encodage et le MP3.
    # Passez à "starter" ou plus pour le ré-encodage de fichiers volumineux.
    plan: free
    region: frankfurt
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false # ex. https://tokflow.onrender.com
      # Base PostgreSQL (demandes d'assistance, compte fondateur) — créée ci-dessous.
      - key: DATABASE_URL
        fromDatabase:
          name: tokflow-db
          property: connectionString
      # Réponses par e-mail (Resend). Sans ces deux variables, aucun envoi n'est tenté.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # ex. TokFlow <support@votre-domaine.fr> (domaine vérifié chez Resend)
      - key: EMAIL_REPLY_TO
        sync: false # facultatif
      - key: TOKFLOW_LINK_ENGINE
        value: ytdlp
      - key: TOKFLOW_PROXY_URL
        sync: false # facultatif : proxy sortant du moteur
      - key: MAX_UPLOAD_MB
        value: "200"
      - key: MAX_DURATION_SECONDS
        value: "900"
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      - key: JOB_TIMEOUT_SECONDS
        value: "180"

databases:
  - name: tokflow-db
    plan: free
    region: frankfurt
